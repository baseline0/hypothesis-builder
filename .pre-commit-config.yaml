
repos:
  - repo: https://github.com/baseline0/fleet-base
    rev: v1.0.0
    hooks:
      - id: fleet-governance-validate
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: bash ../fleet-base/scripts/check-repo-root-pattern.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
