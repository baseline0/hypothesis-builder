[project]
name = "hypothesis-builder"
version = "0.1.0"
description = "Hypothesis specification compiler and validators"
requires-python = ">=3.13"
authors = [{name = "Mark Alexiuk", email = "malexiuk@gmail.com"}]
license = {text = "MIT"}
dependencies = [
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]
# Markdown is not ruff territory: ruff 0.16 would reformat Python snippets inside it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "Use typer for CLIs (fleet mandate)."
