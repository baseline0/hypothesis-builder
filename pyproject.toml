[project]
name = "hypothesis-builder"
version = "0.1.0"
description = "Hypothesis specification compiler and validators"
requires-python = ">=3.13"
authors = [{name = "Mark Alexiuk", email = "malexiuk@gmail.com"}]
license = {text = "MIT"}
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4"]
ignore = ["E501", "SIM105"]
