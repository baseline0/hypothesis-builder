type: research
language: python
test_framework: pytest
standards:
  type_hints: optional
  docstrings: google-style
  max_line_length: 120
governance:
  enabled: false
  fixable-categories: []
  protected-paths:
  - AUTHORIZATION_GATE.md
  - automation/
testing:
  min_coverage: 0
  test_command: pytest tests/
  coverage_report: html
guard-rails:
  max-lines-changed: 2000
  require-approval: false
schema_version: '1.0'
